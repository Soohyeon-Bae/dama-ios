workflows:
  ios-unsigned:
    name: 담아 iOS 서명 전 빌드
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: v22.11.0
      xcode: latest
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Prepare iOS app
        script: |
          npm run check
          npm test
          npm run build
          npx cap add ios
          npx cap sync ios
          node scripts/prepare-ios.mjs
      - name: Compile iOS without signing
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Launch in iOS Simulator
        script: bash scripts/smoke-ios-simulator.sh
    artifacts:
      - build/DerivedData/Build/Products/**/*.app
      - build/SimulatorDerivedData/Build/Products/**/*.app
      - build/simulator-launch.png
      - /tmp/xcodebuild_logs/*.log
